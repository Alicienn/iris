[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "4.14.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Alicienn/iris"

[workspace.dependencies]
iris-types = { path = "crates/iris-types" }
iris-kernel = { path = "crates/iris-kernel" }
iris-store = { path = "crates/iris-store" }
iris-blobs = { path = "crates/iris-blobs" }
iris-mime = { path = "crates/iris-mime" }
iris-thread = { path = "crates/iris-thread" }
iris-workflow = { path = "crates/iris-workflow" }
iris-rules = { path = "crates/iris-rules" }
iris-search = { path = "crates/iris-search" }
iris-theme = { path = "crates/iris-theme" }
iris-viewmodel = { path = "crates/iris-viewmodel" }
iris-index = { path = "crates/iris-index" }
iris-imap = { path = "crates/iris-imap" }
iris-smtp = { path = "crates/iris-smtp" }
iris-sync = { path = "crates/iris-sync" }
iris-discover = { path = "crates/iris-discover" }
iris-plugin-sdk = { path = "crates/iris-plugin-sdk" }
iris-secrets = { path = "crates/iris-secrets" }
iris-oauth = { path = "crates/iris-oauth" }
iris-htmlview = { path = "crates/iris-htmlview", default-features = false }
iris-ui = { path = "crates/iris-ui" }
iris-plugins = { path = "crates/iris-plugins" }
iris-calendar = { path = "crates/iris-calendar" }
iris-caldav = { path = "crates/iris-caldav" }
iris-tasks = { path = "crates/iris-tasks" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Le profil de release vise la taille et la prévisibilité des temps de frame :
# une seule unité de codegen permet l'inlining inter-crate sur les chemins chauds.
#
# LTO « thin » plutôt que « fat », mesuré le 2026-09-30 (-j 4 comme le runner Windows,
# dépendances déjà compilées) : 1 967 s contre 3 415 s pour les caisses du projet,
# binaire 66,7 Mo contre 65,2, et `mesure` à 41,8–42,1 Mo fenêtre ouverte contre
# 44,0–44,1. Une autre compilation tournait sur la machine pendant une partie de la
# mesure : l'écart de temps est indicatif, le sens ne l'est pas.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Les symboles restent. « symbols » les retirait, et le crochet de panique n'aurait
# alors écrit qu'une pile d'adresses hexadécimales — c'est-à-dire rien. La table des
# symboles coûte quelques mégaoctets ; une trace lisible vaut plus que ça.
strip = "debuginfo"

# Les mesures de performance doivent être faites sur du code optimisé, mais
# rester débogables.
[profile.bench]
inherits = "release"
debug = true
strip = "none"

# Le profil de développement.
#
# `debug = "line-tables-only"` plutôt que l'information complète. Le répertoire de
# compilation avait atteint **188 gigaoctets** et rempli le disque, ce qui a fini par
# faire tomber l'application : quatre-vingt-quinze gigaoctets d'objets et de binaires
# de test, et soixante-dix-huit de cache incrémental. Une pile d'appels avec des noms
# de fonctions et des numéros de ligne suffit à déboguer ; les types de chaque variable
# locale de chaque dépendance ne servent à personne ici et coûtent l'essentiel de cette
# place.
[profile.dev]
debug = "line-tables-only"

# Compiler les dépendances en optimisé même en debug : sans cela, zstd, tantivy
# et le rendu sont inutilisables pendant le développement.
[profile.dev.package."*"]
opt-level = 2
# Aucune information de débogage pour les dépendances. On ne pose pas de point d'arrêt
# dans « wasmtime » ; en garder les symboles complets revient à payer plusieurs
# dizaines de gigaoctets pour un pas-à-pas que personne ne fera.
debug = false
