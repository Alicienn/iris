# Cargo settings for the CI's test jobs only (`cargo test --config .github/cargo-ci.toml`).
#
# Neither the profile used on this machine nor the binary that ships changes: the
# release build in ci.yml does not read this file.

# The dependencies at opt-level 1 rather than the 2 of `profile.dev.package."*"`. The
# tests take forty seconds; compiling some six hundred crates optimised took thirty
# minutes of every run. Level 1 still keeps zstd, tantivy and the renderer usable.
[profile.dev.package."*"]
opt-level = 1

# LLVM's linker rather than Microsoft's: seven integration-test binaries each link the
# whole application or interface.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# No Rust line tables for the interface crate: its generated code is one very large
# module, and with them LLVM ran out of memory on the runners (6.8.0). The tests still
# find elements by label: ci.yml sets IRIS_UI_DEBUG_INFO=1, which keeps Slint's own
# debug info (crates/iris-ui/build.rs).
[profile.dev.package.iris-ui]
debug = false
