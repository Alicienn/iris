# Publishing a version, continuously.
#
# Every push to main that passes CI is looked at here. If the version in Cargo.toml
# has no GitHub release yet, the installer is built on Windows and published as the
# release `vX.Y.Z` — tag included — with that version's section of CHANGELOG.md as its
# notes. Every running copy of Iris finds it at its next check: at launch, or within
# six hours. A push that keeps the same version publishes nothing.
#
# Pushing a tag `vX.Y.Z` by hand, or running the workflow from the Actions tab, does
# the same for the commit it points at. The tag must match Cargo.toml: a release
# called 0.3.0 that installs a binary saying 0.2.0 would be offered again forever.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  # To take the binary CI already built, rather than build it again.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  installer:
    name: Installer
    runs-on: windows-latest
    # After CI: only a green run of a push to main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version, and whether it is already out
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifeste = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifeste, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw "No version in Cargo.toml" }
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml ($version)"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "TARGET=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag is already published: nothing to do."
            "PUBLISH=false" >> $env:GITHUB_ENV
          } else {
            Write-Host "$tag has no release yet: building it."
            "PUBLISH=true" >> $env:GITHUB_ENV
          }
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: env.PUBLISH == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.PUBLISH == 'true'

      # After CI, the binary is the one CI built and tested: the same commit, the
      # same release profile. Building it again took half an hour of the release.
      - name: Binary from CI
        if: env.PUBLISH == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: iris-exe
          path: target/release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # CI already checked it on that path; a tag or a manual run has had no CI.
      - name: Changelog matches the version
        if: env.PUBLISH == 'true' && github.event_name != 'workflow_run'
        run: cargo test -p iris-app --lib --no-default-features changelog

      - name: Inno Setup
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          if (Test-Path target/release/iris.exe) {
            ./packaging/build-installer.ps1 -UseBuiltBinary
          } else {
            ./packaging/build-installer.ps1
          }

      # What Iris reads to update, without GitHub's API and its hourly limit: the
      # version, the installer's name, size and SHA-256, signed with the project's
      # Ed25519 key. Iris holds the public half and refuses a manifest that does not
      # verify, then an installer that does not match it.
      - name: Signed manifest
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set" }
          $exe = "packaging/output/iris-setup-$env:VERSION.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          $json = '{"version":"' + $env:VERSION + '","tag":"' + $env:TAG + '","installer":"iris-setup-' + $env:VERSION + '.exe","size":' + $size + ',"sha256":"' + $hash + '"}'
          [IO.File]::WriteAllText((Resolve-Path packaging/output).Path + "/latest.json", $json, [Text.UTF8Encoding]::new($false))
          $cle = Join-Path $env:RUNNER_TEMP "update-key.pem"
          [IO.File]::WriteAllText($cle, $env:UPDATE_SIGNING_KEY)
          $openssl = "C:\Program Files\Git\usr\bin\openssl.exe"
          if (-not (Test-Path $openssl)) { $openssl = "openssl" }
          & $openssl pkeyutl -sign -rawin -inkey $cle -in packaging/output/latest.json -out packaging/output/latest.json.sig
          $code = $LASTEXITCODE
          Remove-Item $cle
          if ($code -ne 0) { throw "openssl could not sign the manifest" }
          if ((Get-Item packaging/output/latest.json.sig).Length -ne 64) { throw "The signature is not 64 bytes" }
          Get-Content packaging/output/latest.json

      - name: Release notes
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          # This version's section of the changelog, without its heading: the
          # release already carries the version as its title.
          $texte = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($texte, "(?ms)^## \[?v?$([regex]::Escape($env:VERSION))\]?[^\n]*\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $env:VERSION" }
          Set-Content -Path notes.md -Value $section -Encoding utf8

      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Creates the tag on the commit that was built, unless it already exists.
          gh release create $env:TAG `
            "packaging/output/iris-setup-$env:VERSION.exe" `
            packaging/output/latest.json `
            packaging/output/latest.json.sig `
            --target $env:TARGET `
            --title "Iris $env:VERSION" `
            --notes-file notes.md `
            --latest
