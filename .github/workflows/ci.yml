# Intégration continue.
#
# Trois exigences, dans l'ordre où elles font gagner du temps : le format et les
# lints d'abord, parce qu'ils échouent en une minute ; la compilation ensuite ; les
# tests en dernier, parce qu'ils sont les plus longs.
#
# Windows only: it is what ships, and Release follows this workflow. macOS runs the
# same tests in `macos.yml`, once a day, without holding a release back.

name: CI

on:
  push:
    branches: [main, master]
    # Text that is not compiled has nothing to check. CHANGELOG.md is compiled in, so
    # it is not listed.
    paths-ignore: ["docs/**", "**/README.md", "CLAUDE.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/README.md", "CLAUDE.md"]
  # To measure the pipeline again without a commit. Release ignores these runs.
  workflow_dispatch:

# A newer push to a pull request makes the run on the older one pointless. Never on
# main: each of its runs may be the one that publishes a version, so each gets a
# group of its own (a shared one would queue them, and drop the queued one).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Un avertissement laissé passer devient un avertissement permanent, puis mille.
  RUSTFLAGS: -D warnings

jobs:
  # Ce qui ne dépend d'aucune plateforme n'est vérifié qu'une fois.
  forme:
    name: Format et lints
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved even when the job fails: by default a red run saved nothing, the
          # fix pushed after it compiled every crate again, and a cache left unused
          # for a week is gone. From main only, so other runs cannot push it out of
          # the repository's 10 GB.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets

  # macOS runs the same tests in `macos.yml`, a workflow of its own: Release waits for
  # this one, and the installer is Windows-only, so it no longer waits for macOS —
  # which took up to twenty minutes longer than everything here. It runs once a day.
  tests:
    name: Tests (windows-latest)
    runs-on: windows-latest

    # Keep the dev profile's debug info: iris-ui's build script emits the interface's
    # debug info only when it is on (`DEBUG=true`), and the interface tests find their
    # elements through it.

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved even when the job fails: by default a red run saved nothing, the
          # fix pushed after it compiled every crate again, and a cache left unused
          # for a week is gone. From main only, so other runs cannot push it out of
          # the repository's 10 GB.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Le rendu HTML complet demande un périphérique graphique. Les tests savent
      # s'en passer — `BlitzRenderer::is_available` le vérifie — mais compiler la
      # dépendance sur chaque exécution coûte plusieurs minutes pour un chemin que
      # l'intégration continue ne peut de toute façon pas exercer.
      #
      # `--lib --tests`: the unit and integration tests, nothing else. `cargo test`
      # alone also built every example (each one a full link of the interface) and
      # ran the doc-tests, and there are none; clippy `--all-targets` already checks
      # that the examples compile. The build is the same command with `--no-run`, so
      # the tests reuse all of it; `cargo build` built the binary, which no test runs.
      # `cargo-ci.toml`: lighter optimisation of the dependencies and a faster linker,
      # for these tests only (see the file).
      - name: Compilation
        run: cargo test --config .github/cargo-ci.toml --workspace --no-default-features --lib --tests --no-run

      - name: Tests
        # Every failing binary reported in one run, not only the first.
        run: cargo test --config .github/cargo-ci.toml --workspace --no-default-features --lib --tests --no-fail-fast

  # Le binaire complet, avec le moteur de rendu, sur la plateforme prioritaire.
  # Il ne s'exécute pas ici : sans écran, il n'y a rien à ouvrir. On vérifie qu'il
  # se construit, ce qui est la panne la plus fréquente et la plus bête.
  binaire:
    name: Binaire complet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved even when the job fails: by default a red run saved nothing, the
          # fix pushed after it compiled every crate again, and a cache left unused
          # for a week is gone. From main only, so other runs cannot push it out of
          # the repository's 10 GB.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compilation en release
        run: cargo build --release -p iris-app

      # Le binaire servira tel quel à l'installeur : le workflow Release le reprend
      # au lieu de refaire la même compilation de trente minutes.
      - name: Binaire pour la publication
        uses: actions/upload-artifact@v4
        with:
          name: iris-exe
          path: target/release/iris.exe
          retention-days: 3

  # Iris for Android: the library built by cargo-ndk for phones (arm64) and the
  # emulator (x86_64), packaged by Gradle. Its APK goes to the release beside the
  # installer. `continue-on-error`: a broken Android build is shown here but never
  # holds back a Windows release (Release follows this workflow's conclusion).
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Warnings are shown, not fatal, here: code only Windows uses is dead on Android,
    # and the lints already ran on Windows.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "IRIS_VERSION=$version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Slint's Android backend compiles a little Java against android.jar: it wants
      # a platform in the SDK, and finds the SDK by ANDROID_HOME.
      - name: Android SDK platform
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          # Named outright: the runner also holds previews (android-37.2-beta3…) that
          # the backend's search does not read.
          test -f "$sdk/platforms/android-35/android.jar"
          echo "ANDROID_PLATFORM=35" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$sdk/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS_VERSION=35.0.0" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # Without its symbols (the 6.3.0 APK, with them, weighed 249 MB). Windows keeps
      # them for its panic reports (Cargo.toml).
      - name: The library
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p iris-android
          ls -l android/app/src/main/jniLibs/*/

      # The project's signing key when the secrets are there (see android/README.md),
      # else the build machine's debug key.
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iris.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/iris.jks" >> "$GITHUB_ENV"
          fi

      - name: The APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/iris-$IRIS_VERSION.apk"

      - name: APK for the release
        uses: actions/upload-artifact@v4
        with:
          name: iris-apk
          path: apk/*.apk
          retention-days: 3
