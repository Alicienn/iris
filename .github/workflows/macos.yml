# The test suite on macOS.
#
# The same tests as the Windows job of `ci.yml`, in a workflow of its own so that
# Release, which follows CI, does not wait for it: the installer is Windows-only, and
# this job was the longest of all. A failure here still shows red on the commit.
#
# Once a day rather than on every push: it repeated, for an hour each time, the tests
# Windows had just run, and only the few lines of code written for macOS can fail here
# alone. A day's pushes are tested together; "Run workflow" tests one at once.

name: CI macOS

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  tests:
    name: Tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # As in ci.yml: saved when the job fails too, from main only.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same flags and settings as ci.yml, and for the same reasons.
      - name: Compilation
        run: cargo test --config .github/cargo-ci.toml --workspace --no-default-features --lib --tests --no-run

      - name: Tests
        run: cargo test --config .github/cargo-ci.toml --workspace --no-default-features --lib --tests --no-fail-fast
