[package]
name = "iris-peer"
description = "Two copies of Iris on one network: pairing, a sealed channel, the exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
blake3 = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hex = "0.4"
zstd = "0.13"
thiserror = { workspace = true }
mdns-sd = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }
