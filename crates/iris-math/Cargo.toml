[package]
name = "iris-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Les formules : du LaTeX à une image, en Rust seulement (la police STIX Two Math est
# dans la caisse), gardées en mémoire tant qu'on les montre.

[dependencies]
latex-rust = { version = "1", features = ["png"] }
image = { version = "0.25", default-features = false, features = ["png"] }
