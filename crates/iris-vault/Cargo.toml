[package]
name = "iris-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Les notes sur le disque : les espaces, leur arborescence, l'écriture sûre d'un
# fichier, ce qui a changé dessous. Aucune fenêtre, aucune base.

[dependencies]
iris-types = { workspace = true }
iris-notes = { path = "../iris-notes" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
