[package]
name = "iris-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "iris"
path = "src/main.rs"
# No test in main.rs: its test build was one more link of the whole interface for
# zero tests.
test = false

[features]
# Le moteur HTML complet, transmis a iris-htmlview.
default = ["blitz"]
blitz = ["iris-htmlview/blitz"]

[dependencies]
iris-types = { workspace = true }
iris-kernel = { workspace = true }
iris-store = { workspace = true }
iris-blobs = { workspace = true }
iris-index = { workspace = true }
iris-mime = { workspace = true }
iris-tasks = { workspace = true }
iris-growth = { workspace = true }
iris-imap = { workspace = true }
iris-smtp = { workspace = true }
iris-sync = { workspace = true }
iris-theme = { workspace = true }
iris-secrets = { workspace = true }
iris-peer = { workspace = true }
qrcode = { version = "0.14", default-features = false }
iris-oauth = { workspace = true }
iris-discover = { workspace = true }
iris-htmlview = { workspace = true, default-features = false }
iris-viewmodel = { workspace = true }
iris-workflow = { workspace = true }
iris-rules = { workspace = true }
iris-ui = { workspace = true }
iris-calendar = { workspace = true }
iris-notes = { path = "../iris-notes" }
iris-vault = { path = "../iris-vault" }
iris-math = { path = "../iris-math" }
iris-sheets = { path = "../iris-sheets" }
# The notes' editor lays its text out as Slint does (the same version, already in the
# tree through Slint), to know where every character is.
parley = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
iris-caldav = { workspace = true }
# L'heure locale de l'agenda, et le nom de son fuseau pour les récurrences.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
tokio = { workspace = true, features = ["net"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
directories = "6"
rpassword = "7"
tracing = "0.1"
# La capture de pile de la décomposition mémoire. C'est la caisse dont la
# bibliothèque standard se sert elle-même pour ses propres traces.
backtrace = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Les mises à jour : la même pile HTTP que la découverte et OAuth, donc rien de plus
# à compiler, et l'empreinte SHA-256 par ring, déjà présent sous rustls.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
ring = "0.17"
hex = "0.4"

# A desktop: Slint over winit (the software renderer only), the clipboard's images,
# the system's file dialogs.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software", "std", "unstable-winit-030"] }
# An image pasted into a note: read from the clipboard, written as PNG beside it.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Native file pickers. `xdg-portal` off: the Windows build has no use for it and
# it drags in a GTK stack that has no business in this binary.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

# Android: Slint on its own activity backend (NativeActivity, started by iris-android);
# the clipboard and the pickers go through the platform (`presse`, `dialogue`).
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "renderer-software", "std", "backend-android-activity-06"] }

# L'icône de la zone de notification. Windows seulement, et sans les fonctions par
# défaut : celles-ci tirent une pile GTK qui ne sert qu'à Linux et n'a rien à faire
# dans ce binaire.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
# Les bulles de notification. Une caisse plutôt qu'un appel direct : une bulle
# moderne passe par WinRT, dont la surface est bien plus large que les quelques
# fonctions du registre que nous appelons nous-mêmes.
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
log = "0.4"
tempfile = "3"
iris-viewmodel = { workspace = true }
iris-workflow = { workspace = true }
iris-rules = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Une fenêtre sans écran, pour tester ce que l'envoi fait à l'interface.
i-slint-backend-testing = "1.17"

# La mesure affiche une infolettre : elle n'a de sens qu'avec le moteur complet.
[[example]]
name = "mesure"
required-features = ["blitz"]

[[example]]
name = "corps"
required-features = ["blitz"]
