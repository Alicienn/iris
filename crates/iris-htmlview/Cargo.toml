[package]
name = "iris-htmlview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Le moteur HTML complet. Optionnel : il tire une pile graphique entière, et
# l'application reste pleinement fonctionnelle sans lui.
default = ["blitz", "remote-images"]
blitz = ["dep:blitz-dom", "dep:blitz-html", "dep:blitz-paint", "dep:blitz-traits", "dep:anyrender", "dep:anyrender_vello"]
# Aller chercher les images distantes quand le lecteur le demande. Séparé de
# « blitz » parce que c'est la seule chose de tout le programme de rendu qui
# touche au réseau, et qu'une compilation qui ne peut pas en sortir se
# vérifie plus facilement qu'une promesse de ne pas le faire.
remote-images = ["dep:reqwest"]

[dependencies]
iris-types = { workspace = true }
tracing = "0.1"
# Décoder les images que le message transporte lui-même. Sans elle, un logo de
# signature déjà présent dans le message s'affichait comme une icône et le mot
# « image ».
#
# Les formats et rien d'autre : pas de lecture de fichiers, pas de codeurs. Ce qui
# entre ici vient d'un inconnu, et chaque décodeur supplémentaire est une surface de
# plus à laquelle on ne pense jamais. La caisse est déjà dans l'arbre par le moteur de
# rendu, donc elle ne coûte pas une dépendance de plus.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
blitz-dom = { version = "0.2", optional = true }
blitz-html = { version = "0.2", optional = true }
blitz-paint = { version = "0.2", optional = true }
blitz-traits = { version = "0.2", optional = true }
# Versions alignees a dessein : « blitz-paint » 0.2 s'appuie sur « anyrender » 0.6,
# et seul « anyrender_vello » 0.6 parle cette version du trait de peinture. Les
# versions plus recentes des deux cotes ne sont pas encore synchronisees entre
# elles ; les melanger produit deux traits « PaintScene » incompatibles.
anyrender = { version = "0.6", optional = true }
anyrender_vello = { version = "0.6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }
