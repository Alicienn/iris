[package]
name = "iris-htmlview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Le moteur HTML complet. Optionnel : il tire une pile graphique entière, et
# l'application reste pleinement fonctionnelle sans lui.
default = ["blitz", "remote-images"]
blitz = ["dep:blitz-dom", "dep:blitz-html", "dep:blitz-paint", "dep:blitz-traits", "dep:anyrender", "dep:anyrender_vello_cpu"]
# Aller chercher les images distantes quand le lecteur le demande. Séparé de
# « blitz » parce que c'est la seule chose de tout le programme de rendu qui
# touche au réseau, et qu'une compilation qui ne peut pas en sortir se
# vérifie plus facilement qu'une promesse de ne pas le faire.
remote-images = ["dep:reqwest"]

[dependencies]
iris-types = { workspace = true }
tracing = "0.1"
# Décoder les images que le message transporte lui-même. Sans elle, un logo de
# signature déjà présent dans le message s'affichait comme une icône et le mot
# « image ».
#
# Les formats et rien d'autre : pas de lecture de fichiers, pas de codeurs. Ce qui
# entre ici vient d'un inconnu, et chaque décodeur supplémentaire est une surface de
# plus à laquelle on ne pense jamais. La caisse est déjà dans l'arbre par le moteur de
# rendu, donc elle ne coûte pas une dépendance de plus.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
# Blitz 0.3, peint **sur le processeur**.
#
# La 0.2 peignait par Vello sur la carte graphique, dans un device wgpu à elle : une
# deuxième pile graphique complète, à côté de celle de l'interface, pour dessiner un
# message quand on l'ouvre. Ce que ce device engage n'apparaît dans aucun compteur de
# tas — c'est le pilote qui le réserve — et c'était la plus grosse part de la mémoire
# de l'application ouverte. vello_cpu fait le même dessin dans un tampon ordinaire.
#
# Versions épinglées ensemble : blitz-paint 0.3.0-beta.2 parle anyrender 0.13, et
# anyrender_vello_cpu 0.17 est la version de ce trait-là. Sans l'accessibilité ni les
# widgets de Blitz, qu'un corps de message n'emploie pas ; avec les flottants, que les
# infolettres emploient beaucoup.
blitz-dom = { version = "=0.3.0-beta.2", optional = true, default-features = false, features = ["system-fonts", "woff", "floats", "tracing"] }
blitz-html = { version = "=0.3.0-beta.2", optional = true }
blitz-paint = { version = "=0.3.0-beta.2", optional = true, default-features = false }
blitz-traits = { version = "=0.3.0-beta.2", optional = true }
anyrender = { version = "0.13", optional = true }
anyrender_vello_cpu = { version = "0.17", optional = true, default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }
