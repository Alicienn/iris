[package]
name = "iris-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
iris-types = { workspace = true }
iris-store = { workspace = true }
iris-theme = { workspace = true }
serde_json = { workspace = true }
# Sans ses fonctions par défaut : le moteur Blitz est choisi par l'application
# (sa fonction « blitz »), pas imposé par l'interface. Imposé ici, il se compilait
# et se testait même avec --no-default-features, et plantait l'intégration continue,
# qui n'a pas de carte graphique.
iris-htmlview = { workspace = true }
iris-viewmodel = { workspace = true }
# The generated window and components (from ui/), compiled once in their own crate.
iris-ui-views = { workspace = true }
tracing = "0.1"
# Les dates de la liste, dans le fuseau de la machine.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Slint over winit on a desktop; on Android the backend comes from iris-app's own
# (android-activity), and the interface itself is the same.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "renderer-software", "std"] }

[dev-dependencies]
i-slint-backend-testing = "1.17"

# La plateforme de test de Slint est liée à un fil ; le harnais de Rust en crée
# un par test. Ce test fournit donc son propre `main`.
[[test]]
name = "interface"
harness = false

[[test]]
name = "saisie"
harness = false

# The window at every width: a phone, a foldable, a PC. Same harness as `saisie`.
[[test]]
name = "largeur"
harness = false
