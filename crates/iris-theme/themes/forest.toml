# Theme "forest" — deep green glass.
#
# The counterpart to "ice": where that one is cold, this is warm and low-contrast, for
# people who read mail at night and find blue light unpleasant at that hour.
#
# The accent is a muted moss rather than a bright green. A saturated accent in a dense
# list draws the eye to whatever happens to be selected, which is exactly the thing
# you already know the position of.

name = "forest"
label = "Forest"
dark = true

[color]
# A near-black with green in it rather than a green with black in it. The difference
# matters at this darkness: the second reads as a tinted screen, the first as a room.
background     = "#0a0d0b"
glow           = "#8fd6a80a"

surface_high   = "#c9f2d80e"
surface        = "#c9f2d806"
surface_low    = "#c9f2d803"
surface_hover  = "#c9f2d811"
surface_active = "#c9f2d81a"

border         = "#c9f2d814"
border_strong  = "#c9f2d828"
edge_light     = "#dcffe81f"

text           = "#e8f2ea"
text_secondary = "#93a698"
text_muted     = "#5d6b62"
text_inverse   = "#0a0d0b"

# Moss, not lime. Muted enough to sit under text without competing with it.
accent         = "#7fb894"
accent_text    = "#0a0d0b"

error          = "#e5484d"
warning        = "#d9a441"
# The success colour is deliberately *not* the accent, even though both are green:
# reusing it would make "this succeeded" and "this is selected" look identical.
success        = "#4e9e6f"

[radius]
small  = 6.0
medium = 9.0
large  = 14.0
pill   = 999.0

[spacing]
unit = 4.0

[typography]
family      = "Segoe UI Variable Text"
family_mono = "Cascadia Mono"
size_small  = 11.0
size_body   = 13.0
size_title  = 15.0
weight_body = 400
weight_bold = 620
tracking    = -0.01
line_height = 1.45

[density]
row_height    = 58.0
row_padding_x = 12.0

[glass]
blur          = 30.0
blur_floating = 24.0
opacity       = 0.86
saturation    = 1.1
grain         = 0.035

[motion]
instant  = 90.0
quick    = 140.0
moderate = 220.0
easing   = "cubic-bezier(0.2, 0, 0, 1)"
