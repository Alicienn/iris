# Iris, dark, in the manner of Apple's own apps: graphite panes, a lighter sidebar,
# the system blue for what to act on, red for today.

name = "dark"
label = "Dark"
dark = true

[color]
background     = "#1a1a1c"
surface_low    = "#2a2a2c"
surface        = "#1e1e1e"
surface_high   = "#2c2c2e"
panel          = "#2c2c2e"
surface_hover  = "#ffffff0d"
surface_active = "#ffffff17"

border         = "#38383a"
border_strong  = "#48484a"

text           = "#f5f5f7"
text_secondary = "#d1d1d6"
text_muted     = "#98989d"
text_faint     = "#636366"
text_inverse   = "#1e1e1e"

accent         = "#0a84ff"
accent_soft    = "#0a84ff2e"
accent_text    = "#ffffff"

error          = "#ff453a"
warning        = "#ff9f0a"
success        = "#30d158"
