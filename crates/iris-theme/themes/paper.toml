# Theme "paper" — the light one.
#
# Every other theme here is dark, which is a preference, not a fact. Plenty of people
# read mail in daylight next to a window, and a dark interface in that setting is not
# elegant, it is unreadable.
#
# Light glass is harder than dark glass: white on white has no depth, so the layering
# comes from a warm off-white ground with progressively *darker* translucent surfaces
# rather than lighter ones. The one-pixel edge stays light, because that is where the
# light would actually catch.

name = "paper"
label = "Paper"
dark = false

[color]
# Not pure white. A pure white ground is what makes long reading tiring, and it leaves
# translucent surfaces nothing to tint.
background     = "#f4f2ee"
glow           = "#00000006"

# Surfaces get darker as they come closer, the inverse of the dark themes. The eye
# still reads the nearest panel as the most present.
surface_high   = "#0000000d"
surface        = "#00000006"
surface_low    = "#00000003"
surface_hover  = "#00000010"
surface_active = "#0000001a"

border         = "#00000016"
border_strong  = "#0000002e"
# The bright edge stays bright: on paper the light catches the top of a raised edge.
edge_light     = "#ffffffcc"

text           = "#16181d"
text_secondary = "#565c68"
text_muted     = "#8a909c"
text_inverse   = "#f4f2ee"

# Ink, not a colour. The monochrome discipline holds in daylight too.
accent         = "#16181d"
accent_text    = "#f4f2ee"

# The functional signals are darkened rather than reused from the dark themes: the
# same red on a light ground is glaring and reads as an alarm when it is a note.
error          = "#b4242a"
warning        = "#8a6412"
success        = "#2f7d4f"

[radius]
small  = 6.0
medium = 9.0
large  = 14.0
pill   = 999.0

[spacing]
unit = 4.0

[typography]
family      = "Inter"
family_mono = "JetBrains Mono"
size_small  = 11.0
size_body   = 13.0
size_title  = 15.0
# Slightly heavier than the dark themes. Dark text on a light ground looks thinner
# than light text on a dark one at the same weight; matching them by number would
# make this theme look faint.
weight_body = 430
weight_bold = 650
tracking    = -0.01
line_height = 1.45

[density]
row_height    = 58.0
row_padding_x = 12.0

[glass]
blur          = 26.0
blur_floating = 20.0
opacity       = 0.9
# No saturation boost: there is nothing colourful underneath to bring out, and pushing
# it would only tint the greys.
saturation    = 1.0
# Less grain than the dark themes. Light surfaces show noise far more readily, and
# what reads as texture on black reads as dirt on paper.
grain         = 0.018

[motion]
instant  = 90.0
quick    = 140.0
moderate = 220.0
easing   = "cubic-bezier(0.2, 0, 0, 1)"
