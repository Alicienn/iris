# Iris, light, in the manner of Apple's own apps: white panes, a sidebar a shade of
# grey, the system blue for what to act on, red for today.

name = "light"
label = "Light"
dark = false

[color]
# The ground behind cards (Home's widgets, grouped settings), and the sidebar.
background     = "#f2f2f4"
surface_low    = "#ebebed"
# Lists, the reader, the calendar's grid: white.
surface        = "#ffffff"
# Cards and what floats over the rest: menus, popovers, windows.
surface_high   = "#ffffff"
panel          = "#ffffff"
surface_hover  = "#0000000a"
surface_active = "#00000012"

border         = "#e3e3e6"
border_strong  = "#d1d1d6"

text           = "#1d1d1f"
text_secondary = "#424245"
text_muted     = "#6e6e73"
text_faint     = "#a1a1a6"
text_inverse   = "#ffffff"

accent         = "#007aff"
accent_soft    = "#007aff1f"
accent_text    = "#ffffff"

error          = "#ff3b30"
warning        = "#ff9500"
success        = "#34c759"
