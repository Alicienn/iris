  <g fill="none" stroke-width="112" stroke-linecap="round">
    <path stroke="url(#blue)" d="M351.3 320.5A250 250 0 0 1 672.7 320.5"/>
    <path stroke="url(#red)" d="M758.2 468.6A250 250 0 0 1 597.5 746.9"/>
    <path stroke="url(#orange)" d="M426.5 746.9A250 250 0 0 1 265.8 468.6"/>
